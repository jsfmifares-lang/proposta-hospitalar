<!DOCTYPE html><html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserir Informações Gerais - CotMed Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-body: #020617;
            --bg-card: #0f172a;
            --bg-input: #0f172a;
            --bg-header: linear-gradient(to right, #0f172a, #083344, #0f172a);
            --border-color: #1e293b;
            --border-input: #334155;
            --border-focus: #06b6d4;
            --text-primary: #f8fafc;
            --text-label: #94a3b8;
            --text-label-cyan: #22d3ee;
            --text-muted: #64748b;
            --accent-red: #f87171;
            --accent-amber: #fbbf24;
            --accent-cyan: #06b6d4;
            --bg-button-primary: #0891b2;
            --bg-button-danger: transparent;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 13px;
            font-weight: 600;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 960px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            overflow: visible;
        }

        /* Header */
        .header {
            background: var(--bg-header);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan);
        }
        .header-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #e2e8f0;
            text-transform: uppercase;
        }
        .header-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: color 0.2s;
        }
        .header-close:hover { color: var(--accent-red); }

        /* Form */
        form { padding: 20px; display: flex; flex-direction: column; gap: 16px; }

        /* Labels */
        .label { display: block; margin-bottom: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
        .label-cyan { color: var(--text-label-cyan); }
        .label-slate { color: var(--text-label); }
        .label-muted { color: var(--text-muted); font-size: 10px; }

        /* Inputs */
        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border-input);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            text-transform: uppercase;
            outline: none;
            transition: border-color 0.2s;
        }
        input::placeholder, textarea::placeholder { color: #475569; }
        input:focus, select:focus, textarea:focus { border-color: var(--border-focus); }
        input[readonly], textarea[readonly] { opacity: 0.5; cursor: default; }
        input:disabled { opacity: 0.5; cursor: not-allowed; color: var(--text-muted); background: #1e293b; border-color: #334155; pointer-events: none; }
        .autocomplete-wrapper { position: relative; }
        .autocomplete-list { position: absolute; top: 100%; left: 0; right: 0; z-index: 100; background: #1e293b; border: 1px solid #334155; border-radius: 0 0 8px 8px; max-height: 200px; overflow-y: auto; display: none; }
        .autocomplete-list.show { display: block; }
        .autocomplete-item { padding: 8px 12px; cursor: pointer; font-size: 12px; color: var(--text-primary); border-bottom: 1px solid #334155; }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover, .autocomplete-item.active { background: #0e7490; }
        .autocomplete-item strong { color: #ffffff; }
        .autocomplete-item small { color: #ffffff; font-size: 11px; }
        select { cursor: pointer; -webkit-appearance: auto; appearance: auto; }
        textarea { resize: vertical; min-height: 50px; }

        /* Grid system */
        .row { display: flex; gap: 12px; flex-wrap: wrap; }
        .row > [class*="col-"] { flex: none; }

        .col-1  { width: calc(8.333% - 11px); }
        .col-2  { width: calc(16.666% - 10px); }
        .col-3  { width: calc(25% - 9px); }
        .col-4  { width: calc(33.333% - 8px); }
        .col-5  { width: calc(41.666% - 7px); }
        .col-6  { width: calc(50% - 6px); }
        .col-7  { width: calc(58.333% - 5px); }
        .col-8  { width: calc(66.666% - 4px); }
        .col-9  { width: calc(75% - 3px); }
        .col-10 { width: calc(83.333% - 2px); }
        .col-11 { width: calc(91.666% - 1px); }
        .col-12 { width: 100%; }

        /* Blocks */
        .block-search {
            background: rgba(0,0,0,0.3);
            padding: 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .section-divider {
            border: none;
            border-top: 1px solid var(--border-color);
            margin-top: 4px;
            margin-bottom: 0;
        }

        /* Checkbox label */
        .check-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            padding-top: 22px;
            font-size: 12px;
        }
        .check-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent-cyan);
            cursor: pointer;
        }
        .check-label.red { color: var(--accent-red); }
        .check-label.red input[type="checkbox"] { accent-color: var(--accent-red); }
        .check-label.amber { color: var(--accent-amber); }
        .check-label.amber input[type="checkbox"] { accent-color: var(--accent-amber); }
        .check-label.cyan-small { padding-top: 0; font-size: 10px; color: var(--text-label); }
        .check-label.cyan-small input[type="checkbox"] { accent-color: var(--accent-cyan); width: 14px; height: 14px; }

        /* Flex helpers */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-end { justify-content: flex-end; }
        .gap-3 { gap: 12px; }
        .gap-2 { gap: 8px; }
        .gap-4 { gap: 16px; }

        /* Proposal number */
        .input-proposta {
            border-color: #0e7490 !important;
            background: var(--bg-body) !important;
            color: var(--accent-cyan) !important;
            font-family: 'Courier New', Courier, monospace !important;
            font-size: 13px !important;
            font-weight: 700 !important;
            letter-spacing: 0.1em;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            font-size: 12px;
            font-weight: 800;
            font-family: inherit;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary {
            background: var(--bg-button-primary);
            color: #fff;
            border: 1px solid #06b6d4;
            box-shadow: 0 4px 12px rgba(6,182,212,0.25);
        }
        .btn-primary:hover { background: #06b6d4; }
        .btn-danger {
            background: var(--bg-button-danger);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }
        .btn-danger:hover { background: rgba(248,113,113,0.1); }

        /* Field with + button */
        .field-with-btn { position: relative; }
        .field-with-btn input { width: 100%; }
        .btn-add {
            position: absolute;
            right: 8px;
            top: 26px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-cyan);
            color: #fff;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            z-index: 2;
            line-height: 1;
        }
        .btn-add:hover { background: #06b6d4; transform: scale(1.1); }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        .modal-header {
            background: var(--bg-header);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }
        .modal-header h2 {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #e2e8f0;
            text-transform: uppercase;
        }
        .modal-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: color 0.2s;
        }
        .modal-close:hover { color: var(--accent-red); }
        .modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .modal-footer {
            padding: 14px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .btn-cancel {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-input);
        }
        .btn-cancel:hover { border-color: var(--accent-red); color: var(--accent-red); }
        .btn-save {
            background: var(--bg-cyan);
            color: #fff;
            border: 1px solid var(--accent-cyan);
        }
        .btn-save:hover { background: var(--accent-cyan); }

        /* Modal Hospital: fontes brancas */
        #modalHospital .label { color: #ffffff !important; }
        #modalHospital input[type="text"] { color: #ffffff !important; }

        /* Responsive */
        @media (max-width: 768px) {
            .row > [class*="col-"] { width: 100% !important; }
            body { padding: 8px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="header-dot"></div>
            <h1 class="header-title">Inserir Informações Gerais</h1>
        </div>
        <button type="button" class="header-close">&times;</button>
    </div>

    <!-- Formulário -->
    <form id="formGerais">

        <!-- Busca CNPJ -->
        <div class="block-search">
            <div class="row">
                <div class="col-3">
                    <label class="label label-slate">Pesquisar por CNPJ</label>
                    <input type="text" id="busca_cnpj" placeholder="Digite o CNPJ...">
                </div>
                <div class="col-9">
                    <label class="label label-slate">Nome do Hospital Localizado</label>
                    <input type="text" id="busca_nome_hospital" placeholder="Aguardando busca no banco de dados..." readonly style="color: var(--text-muted);">
                </div>
            </div>
        </div>

        <!-- Dados do Hospital -->
        <div class="row">
            <div class="col-5 autocomplete-wrapper field-with-btn">
                <label class="label label-cyan">Descrição Hospital</label>
                <input type="text" id="hospital_nome" placeholder="Digite o nome do hospital..." autocomplete="off">
                <button type="button" class="btn-add" onclick="abrirModal('modalHospital')" title="Cadastrar Hospital">+</button>
                <div class="autocomplete-list" id="autocomplete_hospitais"></div>
            </div>
            <div class="col-2">
                <label class="check-label red">
                    <input type="checkbox" id="sem_hospital"> Sem Hospital
                </label>
            </div>
            <div class="col-2">
                <label class="label label-cyan">CNPJ</label>
                <input type="text" id="hospital_cnpj">
            </div>
            <div class="col-3">
                <label class="label label-cyan">Telefone</label>
                <input type="text" id="hospital_telefone">
            </div>
        </div>

        <!-- Endereço -->
        <div class="row">
            <div class="col-4">
                <label class="label label-slate">Rua / Logradouro</label>
                <input type="text" id="hospital_rua">
            </div>
            <div class="col-1">
                <label class="label label-slate">Nº</label>
                <input type="text" id="hospital_numero" style="text-align:center;">
            </div>
            <div class="col-2">
                <label class="label label-slate">CEP</label>
                <input type="text" id="hospital_cep" style="text-align:center;">
            </div>
            <div class="col-2">
                <label class="label label-slate">Bairro</label>
                <input type="text" id="hospital_bairro">
            </div>
            <div class="col-2">
                <label class="label label-slate">Município</label>
                <input type="text" id="hospital_municipio">
            </div>
            <div class="col-1">
                <label class="label label-slate">UF</label>
                <input type="text" id="hospital_uf" style="text-align:center; max-width:50px;">
            </div>
        </div>

        <hr class="section-divider">

        <!-- Médico / Paciente -->
        <div class="row">
            <div class="col-4 field-with-btn">
                <label class="label label-cyan">Médico Solicitante &#x1f4dd;</label>
                <input type="text" id="medico_nome" placeholder="Nome do profissional de saúde...">
                <button type="button" class="btn-add" onclick="abrirModal('modalMedico')" title="Cadastrar Médico">+</button>
            </div>
            <div class="col-5">
                <label class="label label-cyan">Nome Completo do Paciente</label>
                <input type="text" id="paciente_nome">
            </div>
            <div class="col-3">
                <label class="check-label amber">
                    <input type="checkbox" id="venda_direta"> Venda direta
                </label>
            </div>
        </div>

        <!-- Dados Comerciais -->
        <div class="row">
            <div class="col-4 field-with-btn">
                <label class="label label-slate">Convênio Responsável</label>
                <input type="text" id="convenio_nome" placeholder="Ex: UNIMED, BRADESCO...">
                <button type="button" class="btn-add" onclick="abrirModal('modalConvenio')" title="Cadastrar Convênio">+</button>
            </div>
            <div class="col-3">
                <label class="label label-slate">Aos Cuidados De (A/C)</label>
                <input type="text" id="atencao_de" placeholder="Ex: JULIANA SOUZA">
            </div>
            <div class="col-5">
                <div class="flex justify-between items-center">
                    <label class="label label-cyan" style="margin-bottom:6px;">Nº Proposta Gerado</label>
                    <label class="check-label cyan-small">
                        <input type="checkbox" id="com_observacoes" checked> Adicionar Obs.
                    </label>
                </div>
                <input type="text" id="numero_proposta" class="input-proposta" readonly>
            </div>
        </div>

        <!-- Observações -->
        <div id="wrapper_observacoes">
            <label class="label label-slate">Observações da Proposta:</label>
            <textarea id="observacoes" rows="2"></textarea>
        </div>

        <hr class="section-divider">

        <!-- Prazos e Botões -->
        <div class="row" style="align-items: flex-end;">
            <div class="col-3">
                <label class="label label-slate">Prazo de entrega</label>
                <select id="prazo_entrega">
                    <option>Imediato</option>
                    <option>24 Horas</option>
                    <option>48 Horas</option>
                </select>
            </div>
            <div class="col-3">
                <label class="label label-slate">Prazo de pagamento</label>
                <select id="prazo_pagamento">
                    <option>30 (Trinta) Dias</option>
                    <option>60 (Sessenta) Dias</option>
                    <option>À Vista</option>
                </select>
            </div>
            <div class="col-3">
                <label class="label label-slate">Prazo da proposta</label>
                <select id="validade_proposta">
                    <option>10 (Dez) Dias</option>
                    <option>15 (Quinze) Dias</option>
                    <option>30 (Trinta) Dias</option>
                </select>
            </div>
            <div class="col-3" style="text-align:right;">
                <div class="flex justify-end gap-2" style="padding-top:22px;">
                    <button type="button" id="btnLimpar" class="btn btn-danger">Limpar</button>
                    <button type="submit" class="btn btn-primary">Próximo</button>
                </div>
            </div>
        </div>

    </form>
</div>

<!-- ==================== MODAL HOSPITAL ==================== -->
<div class="modal-overlay" id="modalHospital">
    <div class="modal">
        <div class="modal-header">
            <h2>Cadastrar Hospital</h2>
            <button class="modal-close" onclick="fecharModal('modalHospital')">&times;</button>
        </div>
        <div class="modal-body">
            <div class="row">
                <div class="col-4">
                    <label class="label label-cyan">CNPJ</label>
                    <input type="text" id="modal_hospital_cnpj" placeholder="00.000.000/0000-00">
                </div>
                <div class="col-8">
                    <label class="label label-cyan">Nome do Hospital</label>
                    <input type="text" id="modal_hospital_nome" placeholder="Preenchido automaticamente...">
                </div>
            </div>
            <div class="row">
                <div class="col-4">
                    <label class="label label-slate">Telefone</label>
                    <input type="text" id="modal_hospital_telefone">
                </div>
                <div class="col-8">
                    <label class="label label-slate">Rua / Logradouro</label>
                    <input type="text" id="modal_hospital_rua">
                </div>
            </div>
            <div class="row">
                <div class="col-2">
                    <label class="label label-slate">Nº</label>
                    <input type="text" id="modal_hospital_numero">
                </div>
                <div class="col-2">
                    <label class="label label-slate">CEP</label>
                    <input type="text" id="modal_hospital_cep">
                </div>
                <div class="col-3">
                    <label class="label label-slate">Bairro</label>
                    <input type="text" id="modal_hospital_bairro">
                </div>
                <div class="col-3">
                    <label class="label label-slate">Município</label>
                    <input type="text" id="modal_hospital_municipio">
                </div>
                <div class="col-2">
                    <label class="label label-slate">UF</label>
                    <input type="text" id="modal_hospital_uf" maxlength="2" style="text-transform:uppercase;">
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-cancel" onclick="fecharModal('modalHospital')">Cancelar</button>
            <button class="btn btn-save" onclick="salvarHospital()">Cadastrar</button>
        </div>
    </div>
</div>

<!-- ==================== MODAL MÉDICO ==================== -->
<div class="modal-overlay" id="modalMedico">
    <div class="modal">
        <div class="modal-header">
            <h2>Cadastrar Médico</h2>
            <button class="modal-close" onclick="fecharModal('modalMedico')">&times;</button>
        </div>
        <div class="modal-body">
            <div>
                <label class="label label-cyan">Nome Completo</label>
                <input type="text" id="modal_medico_nome" placeholder="Ex: DR(A). JOÃO DA SILVA">
            </div>
            <div class="row">
                <div class="col-6">
                    <label class="label label-slate">CRM</label>
                    <input type="text" id="modal_medico_crm" placeholder="Ex: 12345/BA">
                </div>
                <div class="col-6">
                    <label class="label label-slate">Especialidade</label>
                    <input type="text" id="modal_medico_especialidade" placeholder="Ex: ORTOPEDISTA">
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-cancel" onclick="fecharModal('modalMedico')">Cancelar</button>
            <button class="btn btn-save" onclick="salvarMedico()">Cadastrar</button>
        </div>
    </div>
</div>

<!-- ==================== MODAL CONVÊNIO ==================== -->
<div class="modal-overlay" id="modalConvenio">
    <div class="modal">
        <div class="modal-header">
            <h2>Cadastrar Convênio</h2>
            <button class="modal-close" onclick="fecharModal('modalConvenio')">&times;</button>
        </div>
        <div class="modal-body">
            <div>
                <label class="label label-cyan">Nome do Convênio</label>
                <input type="text" id="modal_convenio_nome" placeholder="Ex: UNIMED, BRADESCO SAÚDE...">
            </div>
            <div class="row">
                <div class="col-6">
                    <label class="label label-slate">CNPJ</label>
                    <input type="text" id="modal_convenio_cnpj" placeholder="00.000.000/0000-00">
                </div>
                <div class="col-6">
                    <label class="label label-slate">Telefone</label>
                    <input type="text" id="modal_convenio_telefone" placeholder="(00) 0000-0000">
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-cancel" onclick="fecharModal('modalConvenio')">Cancelar</button>
            <button class="btn btn-save" onclick="salvarConvenio()">Cadastrar</button>
        </div>
    </div>
</div>

<script>
    // ========== MODAIS (funcionam sem Supabase) ==========
    function abrirModal(id) {
        if (id === 'modalHospital') {
            document.getElementById('modal_hospital_cnpj').value = '';
            document.getElementById('modal_hospital_nome').value = '';
            document.getElementById('modal_hospital_telefone').value = '';
            document.getElementById('modal_hospital_rua').value = '';
            document.getElementById('modal_hospital_numero').value = '';
            document.getElementById('modal_hospital_cep').value = '';

    // ========== AUTOCOMPLETE HOSPITAIS (Supabase) ==========
    var _timerAutocomplete = null;
    var _acIndex = -1;
    var _acResults = [];
    var _acInput = document.getElementById('hospital_nome');
    var _acList = document.getElementById('autocomplete_hospitais');

    function _acPreencherCampos(h) {
        document.getElementById('hospital_nome').value = h.nome || '';
        document.getElementById('hospital_cnpj').value = h.cnpj || '';
        document.getElementById('hospital_telefone').value = h.telefone || '';
        document.getElementById('hospital_rua').value = h.rua || '';
        document.getElementById('hospital_numero').value = h.numero || '';
        document.getElementById('hospital_cep').value = h.cep || '';
        document.getElementById('hospital_bairro').value = h.bairro || '';
        document.getElementById('hospital_municipio').value = h.municipio || '';
        document.getElementById('hospital_uf').value = h.uf || '';
    }

    _acInput.addEventListener('input', function() {
        clearTimeout(_timerAutocomplete);
        _acIndex = -1;
        var termo = _acInput.value.trim();
        if (termo.length < 2) { _acList.classList.remove('show'); _acList.innerHTML = ''; return; }
        if (!supabaseClient) {
            _acList.innerHTML = '<div class="autocomplete-item" style="color:#f87171">Supabase nao conectado</div>';
            _acList.classList.add('show');
            return;
        }
        _timerAutocomplete = setTimeout(function() {
            supabaseClient.from('hospitais').select('*').or('nome.ilike.%' + termo + '%,cnpj.ilike.%' + termo + '%').limit(10)
                .then(function(result) {
                    if (result.error) {
                        _acList.innerHTML = '<div class="autocomplete-item" style="color:#f87171">Erro: ' + result.error.message + '</div>';
                        _acList.classList.add('show');
                        return;
                    }
                    if (!result.data || result.data.length === 0) {
                        _acList.innerHTML = '<div class="autocomplete-item" style="color:#64748b">Nenhum hospital encontrado</div>';
                        _acList.classList.add('show');
                        _acResults = [];
                        return;
                    }
                    _acResults = result.data;
                    _acList.innerHTML = '';
                    result.data.forEach(function(h, i) {
                        var div = document.createElement('div');
                        div.className = 'autocomplete-item';
                        div.innerHTML = '<strong>' + (h.nome || '') + '</strong> <small>CNPJ: ' + (h.cnpj || '') + '</small>';
                        div.addEventListener('click', function() {
                            _acPreencherCampos(h);
                            _acList.classList.remove('show');
                        });
                        _acList.appendChild(div);
                    });
                    _acList.classList.add('show');
                })
                .catch(function(err) {
                    _acList.innerHTML = '<div class="autocomplete-item" style="color:#f87171">Falha na conexao</div>';
                    _acList.classList.add('show');
                });
        }, 400);
    });

    _acInput.addEventListener('keydown', function(e) {
        var items = _acList.querySelectorAll('.autocomplete-item');
        if (!_acList.classList.contains('show') || items.length === 0) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); _acIndex = Math.min(_acIndex + 1, items.length - 1); _acAtualizar(items); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); _acIndex = Math.max(_acIndex - 1, 0); _acAtualizar(items); }
        else if (e.key === 'Enter' && _acIndex >= 0) { e.preventDefault(); _acPreencherCampos(_acResults[_acIndex]); _acList.classList.remove('show'); }
        else if (e.key === 'Escape') { _acList.classList.remove('show'); }
    });
    function _acAtualizar(items) {
        items.forEach(function(it, i) { it.classList.toggle('active', i === _acIndex); });
    }

    document.addEventListener('click', function(e) {
        if (!_acInput.contains(e.target) && !_acList.contains(e.target)) { _acList.classList.remove('show'); }
    });

    // ========== NÚMERO PROPOSTA ==========
    function gerarNumeroProposta() {
        var agora = new Date();
        var data = agora.toISOString().slice(0, 10).replace(/-/g, '');
        var aleatorio = Math.floor(1000 + Math.random() * 9000);
        return 'PH-' + data + '-' + aleatorio;
    }

    // ========== SALVAR HOSPITAL ==========
    function salvarHospital() {
        var nome = document.getElementById('modal_hospital_nome').value.trim();
        var cnpj = document.getElementById('modal_hospital_cnpj').value.trim();
        if (!nome || !cnpj) { alert('Preencha nome e CNPJ.'); return; }
        var cnpjSoDigitos = cnpj.replace(/\D/g, '');

        function _prosseguirCadastro() {
            supabaseClient.from('hospitais').upsert({
                cnpj: cnpjSoDigitos,
                nome: nome,
                telefone: document.getElementById('modal_hospital_telefone').value.trim(),
                rua: document.getElementById('modal_hospital_rua').value.trim(),
                numero: document.getElementById('modal_hospital_numero').value.trim(),
                cep: document.getElementById('modal_hospital_cep').value.trim(),
                bairro: document.getElementById('modal_hospital_bairro').value.trim(),
                municipio: document.getElementById('modal_hospital_municipio').value.trim(),
                uf: document.getElementById('modal_hospital_uf').value.trim()
            }, { onConflict: 'cnpj' })
                .then(function(r) {
                    if (r.error) { alert('Erro Supabase: ' + r.error.message); console.error('Erro Supabase:', r.error); return; }
                    document.getElementById('hospital_nome').value = nome;
                    document.getElementById('hospital_cnpj').value = cnpj;
                    document.getElementById('hospital_telefone').value = document.getElementById('modal_hospital_telefone').value;
                    document.getElementById('hospital_rua').value = document.getElementById('modal_hospital_rua').value;
                    document.getElementById('hospital_numero').value = document.getElementById('modal_hospital_numero').value;
                    document.getElementById('hospital_cep').value = document.getElementById('modal_hospital_cep').value;
                    document.getElementById('hospital_bairro').value = document.getElementById('modal_hospital_bairro').value;
                    document.getElementById('hospital_municipio').value = document.getElementById('modal_hospital_municipio').value;
                    document.getElementById('hospital_uf').value = document.getElementById('modal_hospital_uf').value.toUpperCase();
                    document.getElementById('modalHospital').querySelectorAll('input').forEach(function(i) { i.value = ''; });
                    fecharModal('modalHospital');
                    alert('Hospital cadastrado com sucesso!');
                });
        }

        if (supabaseClient) {
            supabaseClient.from('hospitais').select('cnpj').eq('cnpj', cnpjSoDigitos).limit(1)
                .then(function(r) {
                    if (r.error) { console.error('Erro duplicidade:', r.error); _prosseguirCadastro(); return; }
                    if (r.data && r.data.length > 0) {
                        if (!confirm('Já existe um hospital com este CNPJ. Deseja atualizar os dados dele?')) { return; }
                    }
                    _prosseguirCadastro();
                });
        } else {
            _prosseguirCadastro();
        }
    }
